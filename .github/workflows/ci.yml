name: CI

on:
  push:
    branches: [ develop, master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore OnTrace.sln

      - name: Build
        run: dotnet build OnTrace.sln --no-restore -c Release

      - name: Test
        run: dotnet test OnTrace.Tests/OnTrace.Tests.csproj --no-build -c Release

      - name: Pack
        run: dotnet pack OnTrace/OnTrace.vbproj --no-build -c Release -o ./artifacts
